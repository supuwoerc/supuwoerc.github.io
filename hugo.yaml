# Hugo configuration file
title: Idris's Farms

# import hextra as module
module:
  imports:
  - path: github.com/imfing/hextra

defaultContentLanguage: zh
languages:
  zh:
    languageName: 简体中文
    weight: 1

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: 首页
      pageRef: /
      weight: 1
    - name: 文档
      pageRef: /docs
      weight: 2
    - name: 博客
      pageRef: /blog
      weight: 3
    - name: 归档
      pageRef: /archive
      weight: 4
    - name: 关于
      pageRef: /about
      weight: 5
    - name: Search
      weight: 6
      params:
        type: search
    - name: GitHub
      weight: 7
      url: "https://github.com/supuwoerc"
      params:
        icon: github

params:
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/supuwoerc/supuwoerc.github.io/edit/main/content"

  blog:
    list:
      displayTags: true
      sortBy: date
      sortOrder: desc # or "asc"

  comments:
    enable: true
    type: giscus

    giscus:
      repo: supuwoerc/supuwoerc.github.io
      repoId: R_kgDONBLHPg
      category: Announcements
      categoryId: DIC_kwDONBLHPs4Cjgbc
